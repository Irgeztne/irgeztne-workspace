<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>IRGEZTNE Editor Core v1</title>
  <link rel="stylesheet" href="./editor-core.css">
</head>
<body>
  <main class="ir-editor-shell">
    <header class="ir-editor-head">
      <div>
        <h1>IRGEZTNE Editor Core v1</h1>
        <p>Отдельная песочница редактора. Не подключена к Web Studio.</p>
      </div>
      <button id="clearBtn" type="button">Очистить</button>
    </header>

    <section class="ir-editor-layout">
      <div class="ir-editor-panel">
        <div class="ir-editor-toolbar" aria-label="Editor toolbar">
          <button data-block="p" type="button">P</button>
          <button data-block="h2" type="button">H2</button>
          <button data-block="h3" type="button">H3</button>
          <button data-inline="strong" type="button"><b>B</b></button>
          <button data-inline="em" type="button"><i>I</i></button>
          <button data-inline="u" type="button"><u>U</u></button>
          <button data-block="blockquote" type="button">Quote</button>
          <button data-action="link" type="button">Link</button>
          <button data-action="hr" type="button">Line</button>
        </div>

        <div
          id="editor"
          class="ir-editor-surface"
          contenteditable="true"
          spellcheck="true"
          role="textbox"
          aria-multiline="true"
          data-placeholder="Начните писать текст..."
        ></div>

        <div class="ir-editor-status" id="status">Готово</div>
      </div>

      <aside class="ir-preview-panel">
        <h2>Preview</h2>
        <article id="preview" class="ir-preview"></article>

        <h2>HTML</h2>
        <textarea id="htmlSource" readonly></textarea>
      </aside>
    </section>
  </main>

  <script src="./editor-core.js"></script>
</body>
</html>
