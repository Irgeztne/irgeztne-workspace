[package]
name = "irgeztne-green-lightning-hardening-v04n"
version = "0.4.9"
edition = "2021"
publish = false

[[bin]]
name = "irgeztne-green-lightning-secure-local-service-v04n-lab-l3"
path = "src/main.rs"

[dependencies]
openmls = "=0.8.1"
openmls_basic_credential = "=0.5.0"
openmls_rust_crypto = "=0.5.1"
openmls_sqlite_storage = "=0.2.0"
openmls_traits = "=0.5.0"

# Keep the rusqlite generation already proven with openmls_sqlite_storage 0.2.0.
# The feature unifies the whole crate graph onto bundled SQLCipher.
rusqlite = { version = "=0.32.1", features = ["bundled-sqlcipher-vendored-openssl"] }

keyring = "=4.1.5"
getrandom = "=0.3.4"
hkdf = "=0.12.4"
sha2 = "=0.10.9"
zeroize = "=1.9.0"

serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

libc = "=0.2.189"
